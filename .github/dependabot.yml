# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # Python dependencies via uv (pyproject.toml + uv.lock)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    versioning-strategy: lockfile-only
    # Let a freshly released version settle for a few days before opening a PR, lowering the chance of hitting a "regression on release";
    # semver-minor uses default-days, and only tiers that deviate from it are listed separately.
    # 刚发布的版本先沉淀几天再开 PR，降低撞上「发布即回归」的概率；
    # semver-minor 走 default-days，只有偏离它的档位单列
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "python:uv"
    commit-message:
      prefix: "chore(deps)"
    # pydantic pins the pydantic-core version exactly, so pydantic-core can only be upgraded together with pydantic;
    # upgrading pydantic-core alone would pull pydantic to the matching prerelease. Ignore version updates only:
    # an ignore without update-types would also mask security updates.
    # pydantic 精确锁定 pydantic-core 的版本，pydantic-core 只能随 pydantic 一起升级；
    # 单独升级 pydantic-core 会把 pydantic 拉到与之配套的预发布版。只忽略版本更新：
    # 不带 update-types 的 ignore 会连安全更新一起屏蔽。
    ignore:
      - dependency-name: "pydantic-core"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # Per-domain groups take only minor/patch, aggregated into PRs that are safe to auto-merge;
    # a major matches no group -> becomes its own PR, left for human review.
    # 各域分组只收 minor/patch，聚合成可安全自动合并的 PR；
    # major 不匹配任何分组 → 单独成 PR，留给人工审查。
    groups:
      fastapi-stack:
        patterns:
          - "fastapi"
          - "starlette"
          - "uvicorn"
          - "pydantic*"
          - "python-multipart"
          - "python-dotenv"
        update-types:
          - "minor"
          - "patch"
      database:
        patterns:
          - "sqlalchemy*"
          - "aiosqlite"
          - "asyncpg"
          - "alembic"
        update-types:
          - "minor"
          - "patch"
      ai-sdks:
        patterns:
          - "anthropic"
          - "claude-agent-sdk"
          - "grpcio"
          - "mcp"
          - "google-genai"
          - "openai"
          - "volcengine-python-sdk*"
          - "xai-sdk"
          - "instructor"
        update-types:
          - "minor"
          - "patch"
      auth:
        patterns:
          - "pyjwt"
          - "pwdlib*"
        update-types:
          - "minor"
          - "patch"
      media:
        patterns:
          - "Pillow"
          - "numpy"
          - "pyjianyingdraft"
          - "imageio-ffmpeg"
        update-types:
          - "minor"
          - "patch"
      document-parsing:
        patterns:
          - "pdf-oxide"
          - "mammoth"
          - "docx2txt"
          - "ebooklib"
          - "beautifulsoup4"
          - "lxml"
          - "charset-normalizer"
        update-types:
          - "minor"
          - "patch"
      backend-core:
        patterns:
          - "Jinja2"
          - "PyYAML"
          - "httpx"
          - "jsonpath-rfc9535"
          - "jsonschema"
          - "packaging"
          - "portalocker"
          - "socksio"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        patterns:
          - "anyio"
          - "pytest*"
          - "ruff"
          - "basedpyright"
          - "deptry"
          - "pre-commit"
          - "python-docx"
          - "import-linter"
          - "respx"
          - "mutmut"
          - "blockbuster"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Frontend npm dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/frontend"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # Upgrades within the ^ range only touch the lockfile; only beyond the range (major) is package.json changed and a PR opened.
    # ^ range 内的升级只动 lockfile；超出 range（major）才改 package.json 并开 PR
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    # jsdom is capped at 30.0.x: vitest 4's jsdom environment reads the internal field `_buffer` when converting a jsdom Blob to a Node Blob,
    # which jsdom 30.1 renamed, so tests passing a File to URL.createObjectURL / FormData fail.
    # Unlock condition: frontend upgrades to vitest >= 5.0.3 (which reads the new field).
    # @types/node follows the Node major version (24) in package.json engines, adjusted by hand when Node's major version is upgraded.
    # jsdom 上限是 30.0.x：vitest 4 的 jsdom 环境把 jsdom Blob 转成 Node Blob 时读取内部字段
    # `_buffer`，jsdom 30.1 已将其改名，URL.createObjectURL / FormData 传 File 的测试随之报错。
    # 解锁条件：frontend 升级到 vitest >= 5.0.3（该版本起改读新字段）。
    # @types/node 跟随 package.json engines 的 Node 主版本（24），主版本随 Node 升级手动调整。
    ignore:
      - dependency-name: "jsdom"
        versions: [">=30.1"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
        update-types:
          - "minor"
          - "patch"
      i18n:
        patterns:
          - "i18next"
          - "i18next-*"
          - "react-i18next"
        update-types:
          - "minor"
          - "patch"
      ui-libs:
        patterns:
          - "lucide-react"
          - "@lobehub/*"
          - "@dnd-kit/*"
          - "cmdk"
          - "recharts"
          - "react-resizable-panels"
          - "streamdown"
          - "driver.js"
          - "@fontsource/*"
          - "@fontsource-variable/*"
        update-types:
          - "minor"
          - "patch"
      # Runtime and CLI of the shadcn primitives. A major is kept out of the groups and gets its own PR: in that PR, for installed components,
      # run `pnpm exec shadcn add <component> --diff` and merge by hand (workflow in docs/agents/dependencies.md).
      # shadcn 原语的运行时与 CLI。major 不进分组、单独开 PR：在该 PR 中对已安装组件
      # 运行 `pnpm exec shadcn add <组件> --diff` 并手动合并（流程见 docs/agents/dependencies.md）。
      shadcn-stack:
        patterns:
          - "@base-ui/react"
          - "@shadcn/react"
          - "shadcn"
          - "cn"
          - "class-variance-authority"
          - "tw-animate-css"
        update-types:
          - "minor"
          - "patch"
      vite-tailwind:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "tailwindcss"
          - "@tailwindcss/*"
        update-types:
          - "minor"
          - "patch"
      testing:
        patterns:
          - "vitest"
          - "@vitest/*"
          - "@testing-library/*"
          - "jsdom"
        update-types:
          - "minor"
          - "patch"
      # When @playwright/test is upgraded, the frontend-e2e image version in .github/workflows/test.yml must be changed to match in the same PR,
      # otherwise CI cannot find the browser.
      # @playwright/test 升级时，.github/workflows/test.yml 中 frontend-e2e 的镜像版本要在同一 PR 里改成一致，
      # 否则 CI 找不到浏览器。
      e2e:
        patterns:
          - "@playwright/test"
          - "@axe-core/*"
          - "@types/node"
        update-types:
          - "minor"
          - "patch"
      eslint-stack:
        patterns:
          - "eslint"
          - "eslint-*"
          - "@eslint/*"
          - "typescript-eslint"
          - "globals"
          - "@shadcn/lint"
        update-types:
          - "minor"
          - "patch"
      app-core:
        patterns:
          - "wouter"
          - "zustand"
          - "eventsource-parser"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Docs site npm dependencies (pnpm) / 文档站 npm dependencies (pnpm)
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    cooldown:
      default-days: 7
      semver-major-days: 14
      semver-patch-days: 3
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    # website's typescript is capped at 6.x: website/tsconfig.json extends @docusaurus/tsconfig,
    # which sets baseUrl in compilerOptions -- that option is deprecated in TypeScript 6
    # (tsconfig.json explicitly exempts it with ignoreDeprecations: "6.0") and removed in TypeScript 7,
    # where loading reports TS5102 with no way to exempt it. Unlock condition: @docusaurus/tsconfig drops baseUrl.
    # This constraint covers website/ only; the TypeScript upgrade of frontend/ is judged independently and this does not apply.
    # website 的 typescript 上限是 6.x：website/tsconfig.json 继承 @docusaurus/tsconfig，
    # 后者在 compilerOptions 里设置 baseUrl —— 该选项在 TypeScript 6 被标记弃用
    # （tsconfig.json 以 ignoreDeprecations: "6.0" 显式豁免），在 TypeScript 7 已移除，
    # 加载即报 TS5102，无豁免手段。解锁条件：@docusaurus/tsconfig 去掉 baseUrl。
    # 该约束只覆盖 website/，frontend/ 的 TypeScript 升级独立判断，不适用本条。
    ignore:
      - dependency-name: "typescript"
        versions: [">=7"]
    groups:
      docusaurus:
        patterns:
          - "@docusaurus/*"
          - "@easyops-cn/docusaurus-search-local"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
        update-types:
          - "minor"
          - "patch"
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      all-other:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # The github-actions ecosystem supports only default-days, not semver-granular cooldown fields.
    # github-actions 生态只支持 default-days，不支持 semver 粒度的冷却字段
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
