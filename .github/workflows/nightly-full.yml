name: Nightly Full CI

# Daily full test run without path-based pruning, as a safety net for cross-domain regressions that domain-based pruning might miss
# (for example a backend change breaking the image build, or a dependency upgrade breaking the PG dialect tests).
# 每日全量测试，不应用路径裁剪，兜底按域裁剪可能漏掉的跨域回归
# （例如后端改动破坏镜像构建、依赖升级破坏 PG 方言测试）。

on:
  schedule:
    - cron: "0 20 * * *" # 04:00 Beijing time. / 北京时间 04:00
  workflow_dispatch:

# The report job reads and modifies an issue and cannot be made idempotent under concurrency, so serialize the whole workflow.
# report job 读改 issue 无法并发幂等，串行整个工作流
concurrency:
  group: nightly-full-ci
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-suite:
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read
      pull-requests: read
    secrets:
      # Pass only the secrets the called workflow declares it needs; when adding a secret, declare it explicitly on both sides.
      # 只传被调 workflow 声明需要的 secret；新增 secret 时两边都要显式声明
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    with:
      full: true

  report:
    # On failure open/update a tracking issue with the ci label, and close it automatically on recovery. / 失败时开/更新带 ci 标签的追踪 issue，恢复时自动关闭
    needs: full-suite
    if: always()
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open or close tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.full-suite.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Nightly full CI 失败"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --label ci --state open \
            --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [[ "$RESULT" != "success" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" -R "$GITHUB_REPOSITORY" \
                --body "Nightly 全量 CI 再次失败：$RUN_URL"
            else
              gh issue create -R "$GITHUB_REPOSITORY" --title "$title" --label ci \
                --body "Nightly 全量 CI 失败，运行详情：$RUN_URL"
            fi
          elif [[ -n "$existing" ]]; then
            gh issue close "$existing" -R "$GITHUB_REPOSITORY" \
              --comment "Nightly 全量 CI 已恢复：$RUN_URL"
          fi
