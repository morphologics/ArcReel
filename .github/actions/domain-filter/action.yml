name: domain-filter
description: >-
  按变更域裁剪 CI：输出 workflow / backend / frontend / docker / website 五个域是否
  被本次变更命中。workflow 域（CI 配置本身）变更时另外四个域保守全量触发；full 输入
  为 true 时跳过路径过滤，所有域视为已变更（供 nightly 全量与 schedule 事件使用——
  paths-filter 不支持 schedule 事件的变更比对）。

inputs:
  full:
    description: 为 true 时跳过路径过滤，所有域视为已变更
    required: false
    default: "false"

outputs:
  workflow:
    description: CI 配置域（.github/、.codecov.yml、.gitignore）是否变更
    value: ${{ steps.gate.outputs.workflow }}
  backend:
    description: 后端域（server/lib/tests/alembic/workspace 子包/依赖文件/agent_runtime_profile）是否变更
    value: ${{ steps.gate.outputs.backend }}
  frontend:
    description: 前端域（frontend/）是否变更
    value: ${{ steps.gate.outputs.frontend }}
  docker:
    description: 镜像装配域（Dockerfile/.dockerignore 及不属于代码域的 COPY 源）是否变更
    value: ${{ steps.gate.outputs.docker }}
  website:
    description: 文档站域（website/、CONTRIBUTING.md、两个 README 及翻译 skill）是否变更
    value: ${{ steps.gate.outputs.website }}

runs:
  using: composite
  steps:
    - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
      if: inputs.full != 'true'
      id: filter
      with:
        filters: |
          # .github/** covers all CI infrastructure such as workflows/actions/codeql configuration;
          # .codecov.yml determines coverage status and flag behavior; .gitignore affects ruff's
          # file discovery (respect-gitignore also applies to tracked files).
          # .github/** 覆盖 workflows/actions/codeql 配置等全部 CI 基础设施；
          # .codecov.yml 决定覆盖率状态与 flag 行为；.gitignore 影响 ruff 的
          # 文件发现（respect-gitignore 对已跟踪文件同样生效）
          workflow:
            - '.github/**'
            - '.codecov.yml'
            - '.gitignore'
          backend:
            - 'server/**'
            - 'lib/**'
            - 'tests/**'
            - 'alembic/**'
            - 'alembic.ini'
            - 'scripts/**'
            - 'agent_runtime_profile/**'
            - 'packages/**'
            - 'pyproject.toml'
            - 'uv.lock'
            # Backend contract tests read these frontend source files directly; they also hit the frontend domain.
            # 后端契约测试直接读取这些前端源文件；它们同时命中 frontend 域。
            - 'frontend/src/i18n/*/dashboard.ts'
            - 'frontend/src/i18n/*/events.ts'
            - 'frontend/src/types/workflow.ts'
            - 'frontend/src/data/example-templates/**'
            - 'frontend/src/test/contracts/**'
          frontend:
            - 'frontend/**'
          # The public/ directory and the root README.md are COPY sources of the Dockerfile and do not belong to the
          # backend/frontend domains; when changed alone, they must be verified through docker-verify for image assembly.
          # public/ 目录与根目录 README.md 是 Dockerfile 的 COPY 源且不属于
          # backend/frontend 域，单独变更时需经 docker-verify 验证镜像装配
          docker:
            - 'Dockerfile'
            - '.dockerignore'
            - 'public/**'
            - 'README.md'
          # CONTRIBUTING.md is copied to the site at build time; the two READMEs are not on the site, but both are within the
          # special-case mapping of the translation lockfile, so changes must immediately surface a missing/stale translation report.
          # The translate-docs skill directory is also listed: website-checks' orphan-translation detection, stale report
          # and that skill's unit tests all run the translation-lock.mjs inside it, so when the script changes alone
          # these checks must still run.
          # CONTRIBUTING.md 构建时复制上站；两个 README 不上站，但都在翻译 lockfile 的
          # 特例映射内，改动须当场冒出缺译/滞后报告。translate-docs skill 目录同样列入：
          # website-checks 的孤儿译文检测、滞后报告与该 skill 的单测都执行其中的
          # translation-lock.mjs，脚本单独变更时这些检查必须照常跑。
          website:
            - 'website/**'
            - 'CONTRIBUTING.md'
            - 'README.md'
            - 'README.en.md'
            - '.claude/skills/translate-docs/**'

    - id: gate
      shell: bash
      env:
        FULL: ${{ inputs.full }}
        # In full mode the filter step is skipped and its outputs are empty; provide a fallback uniformly at the expression level.
        # full 模式跳过 filter 步骤时其 outputs 为空，在表达式层统一兜底
        F_WORKFLOW: ${{ steps.filter.outputs.workflow || 'false' }}
        F_BACKEND: ${{ steps.filter.outputs.backend || 'false' }}
        F_FRONTEND: ${{ steps.filter.outputs.frontend || 'false' }}
        F_DOCKER: ${{ steps.filter.outputs.docker || 'false' }}
        F_WEBSITE: ${{ steps.filter.outputs.website || 'false' }}
      run: |
        if [[ "$FULL" == "true" ]]; then
          echo "workflow=true" >> "$GITHUB_OUTPUT"
        else
          echo "workflow=$F_WORKFLOW" >> "$GITHUB_OUTPUT"
        fi
        if [[ "$FULL" == "true" || "$F_WORKFLOW" == "true" ]]; then
          echo "backend=true" >> "$GITHUB_OUTPUT"
          echo "frontend=true" >> "$GITHUB_OUTPUT"
          echo "docker=true" >> "$GITHUB_OUTPUT"
          echo "website=true" >> "$GITHUB_OUTPUT"
        else
          echo "backend=$F_BACKEND" >> "$GITHUB_OUTPUT"
          echo "frontend=$F_FRONTEND" >> "$GITHUB_OUTPUT"
          echo "docker=$F_DOCKER" >> "$GITHUB_OUTPUT"
          echo "website=$F_WEBSITE" >> "$GITHUB_OUTPUT"
        fi
