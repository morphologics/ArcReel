<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Title and description are overridden at startup by main.tsx using BRAND config;
         the values below are just loading-time placeholders. -->
    <title>YouReel Studio · AI video creation studio</title>
    <meta name="description" content="AI video creation studio: projects, scripts, storyboards, video generation and the agent in one place." />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <script>
      // 首屏渲染前按主题偏好加上 .dark，避免先闪一下错误的主题；规则与 src/theme.ts 一致，改时一起改
      var theme = localStorage.getItem("arcreel_theme");
      if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.classList.add("dark");
      }
    </script>

</head>
<body>
    <div id="app-root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>
</html>
